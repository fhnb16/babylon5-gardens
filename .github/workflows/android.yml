name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.apk.outputs.tag }}
      signed: ${{ steps.apk.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Assemble and verify APK
        id: apk
        shell: bash
        env:
          KEYSTORE: ${{ (github.event_name == 'release' || (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')) || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)) && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ (github.event_name == 'release' || (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')) || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)) && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ (github.event_name == 'release' || (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')) || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)) && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ (github.event_name == 'release' || (github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')) || (github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch)) && secrets.ANDROID_KEY_PASSWORD || '' }}
          TAG: ${{ github.event.release.tag_name || ((github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/v')) && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          version=$(node --input-type=module -e "import {VERSION} from './js/version.js'; console.log(VERSION)")
          if [[ -n "$TAG" ]]; then
            [[ "${TAG#v}" == "$version" ]] || { echo "::error::Release tag differs from VERSION"; exit 1; }
          fi
          if [[ -n "$KEYSTORE$ANDROID_KEYSTORE_PASSWORD$ANDROID_KEY_ALIAS$ANDROID_KEY_PASSWORD$TAG" ]]; then
            : "${KEYSTORE:?Missing ANDROID_KEYSTORE_BASE64}" "${ANDROID_KEYSTORE_PASSWORD:?}" "${ANDROID_KEY_ALIAS:?}" "${ANDROID_KEY_PASSWORD:?}"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/gardens.jks"
            trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
            umask 077
            printf '%s' "$KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            variant=Release
          else
            variant=Debug
          fi
          echo "tag=${TAG:-v$version}" >> "$GITHUB_OUTPUT"
          if [[ "$variant" == Release ]]; then echo 'signed=true' >> "$GITHUB_OUTPUT"; fi
          bash android/gradlew -p android ":app:assemble$variant"
          mkdir -p apk
          name=babylon5-gardens
          if [[ "$variant" == Debug ]]; then name+=-debug; fi
          cp "android/app/build/outputs/apk/${variant,,}/app-${variant,,}.apk" "apk/$name.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "apk/$name.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: babylon5-gardens-apk
          path: apk/*.apk
          if-no-files-found: error

  attach:
    if: needs.build.outputs.signed == 'true' && (github.event_name == 'release' || (github.event_name == 'push' && !github.event.deleted && (github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v'))))
    concurrency:
      group: android-release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: babylon5-gardens-apk
          path: apk
      - name: Publish signed APK for the version tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          asset=babylon5-gardens.apk
          if assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            if grep -Fxq "$asset" <<< "$assets"; then
              echo "Release $TAG already contains $asset"
              exit 0
            fi
            exists=true
          else
            exists=false
          fi
          # An existing tag must point to the commit that produced this APK.
          refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq '.[].ref')
          if grep -Fxq "refs/tags/$TAG" <<< "$refs"; then
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq '.sha')
            [[ "$tagged" == "$GITHUB_SHA" ]] || { echo "::error::Tag $TAG points to a different commit"; exit 1; }
          fi
          if [[ "$exists" == true ]]; then
            gh release upload "$TAG" "apk/$asset" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "apk/$asset" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
